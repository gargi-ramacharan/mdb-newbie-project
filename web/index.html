<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>re:live</title>
  <meta name="description" content="Everyone's trip photos in one album, on one map.">
  <style>
    :root { --ink: #1f1c18; --paper: #fff; --muted: rgba(31, 28, 24, 0.6); --tomato: #e2412b; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f5f3ef; --paper: #141311; --muted: rgba(245, 243, 239, 0.6); } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
           background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 420px; }
    .wordmark { font-family: Futura, "Futura PT", "Century Gothic", sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -2px; }
    .wordmark span { color: var(--tomato); }
    p { font-size: 19px; line-height: 1.45; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">re<span>:</span>live</div>
    <p>Everyone's trip photos in one album, on one map. Coming soon to the App Store.</p>
  </main>
</body>
</html>
